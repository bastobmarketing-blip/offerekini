<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <!-- Price tag icon -->
  <g transform="translate(8, 10)">
    <rect x="2" y="2" width="36" height="36" rx="6" fill="#1a5c38"/>
    <rect x="6" y="8" width="22" height="4" rx="2" fill="#f97316"/>
    <rect x="6" y="16" width="28" height="4" rx="2" fill="white" opacity="0.8"/>
    <rect x="6" y="24" width="18" height="4" rx="2" fill="white" opacity="0.6"/>
    <circle cx="32" cy="10" r="3" fill="#f97316"/>
    <!-- Tag notch -->
    <polygon points="38,20 44,14 44,26" fill="#1a5c38"/>
  </g>
  <!-- "Offer" text -->
  <text x="64" y="48" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#1a5c38" letter-spacing="-0.5">Offer</text>
  <!-- "Kini" text -->
  <text x="162" y="48" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#f97316" letter-spacing="-0.5">Kini</text>
  <!-- Tagline -->
  <text x="64" y="64" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="11" fill="#6b7280" letter-spacing="0.5">দাম কম, কথা পরিষ্কার</text>
</svg>
